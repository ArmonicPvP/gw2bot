services:
  bot:
    build:
      context: .
    env_file:
      - .env
    init: true
    restart: unless-stopped
    volumes:
      # Holds the database and, unless SETTINGS_ENCRYPTION_KEY is set, the key
      # that decrypts the settings holding credentials. Back up both together.
      - bot-data:/app/data
    # Uncomment to publish the web calendar (set WEB_ENABLED=true in .env, then
    # set its four credentials with /settings). Both sides follow WEB_PORT, so
    # changing it in .env is enough; hardcoding 2222 here would silently
    # publish a port the bot is not listening on.
    # ports:
    #   - "${WEB_PORT:-2222}:${WEB_PORT:-2222}"

volumes:
  bot-data:
