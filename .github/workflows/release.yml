name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          The smallest release to cut, even when everything merged since the
          last one is a chore. A merged pull request that asks for more still
          gets it.
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # One release at a time and none cancelled. Each run releases everything
    # merged since the newest tag, so one that waits starts from the release
    # the run before it made, and one that never runs is caught up by the
    # next. It is set on the job rather than the workflow so a run whose CI
    # failed, which skips this job, never takes a waiting run's place.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Creates the vX.Y.Z tag and the GitHub release.
      contents: write
      # Finds the pull request each merge on main came from.
      pull-requests: read
      # Pushes the image to GitHub Packages.
      packages: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out the commit to release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          # Every tag and the history between them, to find the last release
          # and the merges since it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Decide the version
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.bump || 'none' }}
        run: >-
          python scripts/next_release.py plan
          --head "$HEAD_SHA"
          --requested "$REQUESTED_BUMP"

      # GitHub Packages refuses capitals in an image name, and the repository
      # is ArmonicPvP/gw2bot.
      - name: Name the image
        if: steps.plan.outputs.release == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Three steps, so that a version is only ever claimed for an image that
      # exists, and only ever points at one. The image is pushed under the
      # commit SHA first, which promises no version; a failed login or build
      # stops the run before anything is claimed, and the next run catches up.
      # The tag then claims the number. Last, the version tags are pointed at
      # the image already pushed, never a rebuild, which is safe to repeat, so
      # re-running a run that failed after tagging finishes the job.
      - name: Log in to GitHub Packages
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      # A tagged commit's image was pushed before its tag was created, and the
      # version tags may already point at it, so a re-run reuses it rather
      # than rebuild it on a newer base.
      - name: Find this commit's image
        id: staged
        if: >-
          steps.plan.outputs.release == 'true' &&
          steps.plan.outputs.tagged == 'true'
        run: |
          if docker buildx imagetools inspect "$IMAGE:$HEAD_SHA" > /dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push this commit's image
        if: >-
          steps.plan.outputs.release == 'true' &&
          steps.staged.outputs.pushed != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GW2BOT_VERSION=${{ steps.plan.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ env.HEAD_SHA }}
          # The source label is what links the package to this repository.
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        if: >-
          steps.plan.outputs.release == 'true' &&
          steps.plan.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$HEAD_SHA"
          --title "$TAG"
          --generate-notes

      - name: Point the version tags at the image
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MINOR: ${{ steps.plan.outputs.minor }}
          MAJOR: ${{ steps.plan.outputs.major }}
        run: >-
          docker buildx imagetools create
          --tag "$IMAGE:$VERSION"
          --tag "$IMAGE:$MINOR"
          --tag "$IMAGE:$MAJOR"
          --tag "$IMAGE:latest"
          "$IMAGE:$HEAD_SHA"
