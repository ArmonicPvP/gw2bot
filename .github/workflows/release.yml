name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          The smallest release to cut, even when everything merged since the
          last one is a chore. A merged pull request that asks for more still
          gets it.
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # One release at a time and none cancelled. Each run releases everything
    # merged since the newest tag, so one that waits starts from the release
    # the run before it made, and one that never runs is caught up by the
    # next. It is set on the job rather than the workflow so a run whose CI
    # failed, which skips this job, never takes a waiting run's place.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Creates the vX.Y.Z tag and the GitHub release.
      contents: write
      # Finds the pull request each merge on main came from.
      pull-requests: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out the commit to release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          # Every tag and the history between them, to find the last release
          # and the merges since it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Decide the version
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.bump || 'none' }}
        run: >-
          python scripts/next_release.py plan
          --head "$HEAD_SHA"
          --requested "$REQUESTED_BUMP"

      # The tag goes first. It is what claims the number: once it exists no
      # later run can give the same version to other code. If anything after
      # it fails, re-running this job finds the tag on its own commit and only
      # publishes the image.
      - name: Tag the release
        if: >-
          steps.plan.outputs.release == 'true' &&
          steps.plan.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$HEAD_SHA"
          --title "$TAG"
          --generate-notes

      - name: Log in to Docker Hub
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      # A published version never changes, so a re-run whose image already
      # went out leaves it alone rather than rebuilding it on a newer base.
      - name: Check whether the image is published
        id: image
        if: steps.plan.outputs.release == 'true'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gw2bot:${{ steps.plan.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::$IMAGE is on Docker Hub already; it is not replaced."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: >-
          steps.plan.outputs.release == 'true' &&
          steps.image.outputs.published == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GW2BOT_VERSION=${{ steps.plan.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gw2bot:${{ steps.plan.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gw2bot:${{ steps.plan.outputs.minor }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gw2bot:${{ steps.plan.outputs.major }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gw2bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gw2bot:${{ env.HEAD_SHA }}
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
