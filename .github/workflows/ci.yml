name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    # Only a pull request has a head branch to judge. On a push or a merge
    # group the job is skipped, which a required check counts as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check the branch prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/next_release.py check-branch "$BRANCH"

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q src scripts tests

      - name: Type check Python source
        run: pyright

      - name: Run tests
        run: python -m pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag gw2bot:ci .
